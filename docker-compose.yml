version: '3.9'

# ═══════════════════════════════════════════════════════════════════════════════
# Zenith Optima — Full-Stack Docker Compose (Development + Integration Testing)
#
# SCALING UPGRADE:
#  - App runs 3 replicas behind Nginx load balancer
#  - Redis Sentinel for HA (master + 2 replicas)
#  - Kafka with 3-partition topics
#  - Postgres with connection pooling via PgBouncer
#  - Loki + Promtail for log aggregation
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Application (3 replicas) ───────────────────────────────────────────────
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sky:skypass@pgbouncer:5432/skyplatform
      DATABASE_READ_URL: postgresql://sky:skypass@postgres:5432/skyplatform
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-min}
      REFRESH_SECRET: ${REFRESH_SECRET:-change-me-refresh-32chars-min}
      DEMO_MODE: ${DEMO_MODE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    networks: [sky-net]
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── PgBouncer (connection pooling) ────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: "postgres://sky:skypass@postgres:5432/skyplatform"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432"
    networks: [sky-net]
    restart: unless-stopped

  # ── PostgreSQL Primary ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyplatform
      POSTGRES_USER: sky
      POSTGRES_PASSWORD: skypass
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky -d skyplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sky-net]
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [sky-net]
    restart: unless-stopped

  # ── Kafka + Zookeeper ─────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper
    ports:
      - "2181:2181"
    networks: [sky-net]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [sky-net]
    restart: unless-stopped

  # ── Nginx Load Balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [sky-net]
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./k8s/monitoring/alerts.yaml:/etc/prometheus/alerts.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks: [sky-net]
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-enterprise:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    networks: [sky-net]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  kafka_data:
  zk_data:
  prometheus_data:
  grafana_data:

networks:
  sky-net:
    driver: bridge
